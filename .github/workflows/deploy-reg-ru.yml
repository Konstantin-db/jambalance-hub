name: Publish Workstation to REG.RU

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "DEPLOYMENT.md"
      - "supabase/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reg-ru-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check deployment secret
        env:
          FTP_PASSWORD: ${{ secrets.REG_RU_FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Add the REG_RU_FTP_PASSWORD repository secret before deploying."
            exit 1
          fi

      - name: Upload site over encrypted FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: server81.hosting.reg.ru
          username: u3551193
          password: ${{ secrets.REG_RU_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./
          server-dir: www/hub.jambalance.ru/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/supabase/**
            supabase/**
            **/.htaccess
            .htaccess
            **/.well-known/**
            .well-known/**
            DEPLOYMENT.md
